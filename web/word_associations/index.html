<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Associations — Private access</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:Arial,sans-serif}header{padding:28px 40px;font-size:12px;font-weight:bold}main{width:min(420px,calc(100% - 48px));margin:15vh auto}h1{font-size:42px;letter-spacing:-2px;line-height:1.05;margin-bottom:20px}p,label{font-size:14px;line-height:1.6;color:#716a79}label{display:block;margin:28px 0 8px}input{width:100%;padding:14px;border:1px solid #d8d3dd;font-size:16px;background:white;border-radius:0}button{margin-top:14px;width:100%;padding:14px;background:#151219;color:#fff;border:0;font-size:14px;cursor:pointer}button:disabled{opacity:.6}#status{min-height:24px;font-size:13px}input:focus-visible,button:focus-visible{outline:2px solid #9855f5;outline-offset:3px}
</style></head><body><header>GREEN COUNTING</header><main><h1>Verbs ×<br>keywords.</h1><p>This project is password protected.</p><form id="access-form"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required autofocus><button id="unlock" type="submit">Enter site</button><p id="status" role="status" aria-live="polite"></p></form></main><script>
(()=>{'use strict';const form=document.querySelector('#access-form'),field=document.querySelector('#password'),button=document.querySelector('#unlock'),status=document.querySelector('#status');const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));let encrypted;
form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;status.textContent='Opening…';try{if(!crypto.subtle)throw new Error('secure');if(!encrypted){const response=await fetch('./site.encrypted.json',{cache:'no-cache'});if(!response.ok)throw new Error('load');encrypted=await response.json();}const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(field.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(encrypted.salt),iterations:encrypted.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(encrypted.iv)},key,bytes(encrypted.payload));field.value='';document.open();document.write(new TextDecoder().decode(clear));document.close();}catch(error){status.textContent=error.name==='OperationError'?'Incorrect password. Please try again.':error.message==='secure'?'Open this page using HTTPS or localhost.':'The site could not be opened. Please reload and try again.';button.disabled=false;field.focus();field.select();}});})();
</script></body></html>
